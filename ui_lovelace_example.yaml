type: vertical-stack
cards:
  - type: custom:mushroom-title-card
    title: Return To Office
  - type: horizontal-stack
    cards:
      - type: custom:mushroom-template-card
        primary: 12-Week Rolling ({{ state_attr('sensor.rto_12_week_count', 'average_days_per_week') | default(0) }}/wk)
        secondary: >-
          {{ states('sensor.rto_12_week_count') }} / {{ state_attr('sensor.rto_12_week_count', 'target') | default(24) }} Days
        icon: mdi:briefcase-check
        entity: sensor.rto_12_week_count
        icon_color: >-
          {% set count = states('sensor.rto_12_week_count') | int(0) %}
          {% set target = state_attr('sensor.rto_12_week_count', 'target') | int(24) %}
          {% if count >= target %} green
          {% elif count >= (target * 0.75) %} orange
          {% else %} red
          {% endif %}
        layout: vertical
      - type: custom:mushroom-template-card
        primary: Current Quarter ({{ state_attr('sensor.rto_quarter_count', 'average_days_per_week') | default(0) }}/wk)
        secondary: >-
          {{ states('sensor.rto_quarter_count') }} / {{ state_attr('sensor.rto_quarter_count', 'target') | default(26) }} Days
        icon: mdi:calendar-check
        entity: sensor.rto_quarter_count
        icon_color: >-
          {% set count = states('sensor.rto_quarter_count') | int(0) %}
          {% set target = state_attr('sensor.rto_quarter_count', 'target') | int(26) %}
          {% if count >= target %} green
          {% elif count >= (target * 0.75) %} orange
          {% else %} red
          {% endif %}
        layout: vertical
  - type: custom:mushroom-template-card
    primary: Today's Office Time
    secondary: >-
      {{ states('sensor.rto_time_in_office_today') }} / {{ state_attr('sensor.rto_time_in_office_today', 'required_hours') }} Hours
    icon: mdi:timer-sand
    entity: sensor.rto_time_in_office_today
    icon_color: >-
      {% set hrs = states('sensor.rto_time_in_office_today') | float(0) %}
      {% set req = state_attr('sensor.rto_time_in_office_today', 'required_hours') | float(0) %}
      {% if req == 0 %} green
      {% elif hrs >= req %} green
      {% elif state_attr('sensor.rto_time_in_office_today', 'is_in_office') %} orange
      {% else %} grey
      {% endif %}
  - type: horizontal-stack
    cards:
      - type: custom:mushroom-template-card
        primary: Add Office Day
        icon: mdi:domain
        icon_color: blue
        layout: vertical
        tap_action:
          action: call-service
          service: rto_tracker.add_office_day
      - type: custom:mushroom-template-card
        primary: Add Vacation
        icon: mdi:palm-tree
        icon_color: cyan
        layout: vertical
        tap_action:
          action: call-service
          service: rto_tracker.add_vacation_day
