alias: "RTO Tracker Notification"
description: "Sends a daily notification if RTO 12-week count is falling behind target."
mode: single
trigger:
  - platform: time
    at: "18:00:00"
condition:
  - condition: time
    weekday:
      - mon
      - tue
      - wed
      - thu
      - fri
  - condition: template
    value_template: >-
      {{ states('sensor.rto_12_week_count') | int(0) < state_attr('sensor.rto_12_week_count', 'target') | int(24) }}
action:
  - service: notify.notify
    data:
      title: "⚠️ RTO Warning"
      message: >-
        You are currently at {{ states('sensor.rto_12_week_count') }} days for your 12-week rolling window.
        Your target is {{ state_attr('sensor.rto_12_week_count', 'target') }} days. 
        Please plan to head into the office soon to stay compliant!
