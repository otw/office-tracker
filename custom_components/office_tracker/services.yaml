add_vacation_day:
  name: Add Vacation Day
  description: Adds a specific date as a vacation day to count towards your Office requirement.
  fields:
    date:
      name: Date
      description: The date to add (YYYY-MM-DD). Defaults to today if omitted.
      required: false
      example: "2023-10-15"
      selector:
        text:

remove_vacation_day:
  name: Remove Vacation Day
  description: Removes a specific date from your vacation days.
  fields:
    date:
      name: Date
      description: The date to remove (YYYY-MM-DD). Defaults to today if omitted.
      required: false
      example: "2023-10-15"
      selector:
        text:

add_office_day:
  name: Add Office Day
  description: Manually adds a specific date as an office day (e.g. if location tracking failed).
  fields:
    date:
      name: Date
      description: The date to add (YYYY-MM-DD). Defaults to today if omitted.
      required: false
      example: "2023-10-15"
      selector:
        text:

remove_office_day:
  name: Remove Office Day
  description: Manually removes a specific date from your tracked office days.
  fields:
    date:
      name: Date
      description: The date to remove (YYYY-MM-DD). Defaults to today if omitted.
      required: false
      example: "2023-10-15"
      selector:
        text:

add_vacation_range:
  name: Add Vacation Range
  description: Manually adds a range of vacation days.
  fields:
    start_date:
      name: Start Date
      description: The first day of the vacation (YYYY-MM-DD).
      required: true
      example: "2023-10-25"
      selector:
        date:
    end_date:
      name: End Date
      description: The last day of the vacation (YYYY-MM-DD).
      required: true
      example: "2023-10-31"
      selector:
        date:

add_office_day_range:
  name: Add Office Day Range
  description: Manually adds a range of office days (automatically skips weekends).
  fields:
    start_date:
      name: Start Date
      description: The first day in the office (YYYY-MM-DD).
      required: true
      example: "2023-10-25"
      selector:
        date:
    end_date:
      name: End Date
      description: The last day in the office (YYYY-MM-DD).
      required: true
      example: "2023-10-31"
      selector:
        date:
